<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>بيانات المشارك</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#edf3ef;font-family:Arial,sans-serif;color:#173d30;padding:24px 14px}main{max-width:540px;margin:auto;background:#fff;border:1px solid #c5a05966;border-radius:24px;overflow:hidden;box-shadow:0 16px 55px #003d2418;text-align:center}header{background:#003d24;color:#fff;padding:28px 20px;border-bottom:3px solid #c5a059}header img{display:block;max-width:180px;max-height:110px;object-fit:contain;margin:0 auto 18px}h1{font-size:23px;line-height:1.7;margin:0}#content{padding:26px 22px}#portrait{width:150px;height:180px;object-fit:cover;border:3px solid #c5a059;border-radius:20px;margin:0 auto 18px;display:block}h2{font-size:25px;line-height:1.6;margin:8px 0}p{line-height:1.9;overflow-wrap:anywhere}section{border:1px solid #c5a05940;background:#faf8f2;border-radius:16px;padding:16px;margin-top:20px}h3{font-size:17px;margin:0 0 12px}a{display:inline-block;background:#003d24;color:white;padding:11px 20px;border-radius:10px;text-decoration:none;margin-top:10px}#contacts{white-space:pre-wrap}footer{padding:18px;font-size:11px;color:#687b70;border-top:1px solid #ddd}#status{padding:30px 20px}[hidden]{display:none!important}
body{padding:20px 16px;font-size:19px}main{width:100%;max-width:850px;border-radius:28px}header{padding:32px 24px}header img{max-width:260px;max-height:160px}h1{font-size:30px}#content{padding:32px}#portrait{width:200px;height:240px;border-radius:22px}h2{font-size:34px}p{font-size:20px;line-height:1.95}h3{font-size:23px}section{padding:24px;margin-top:24px}strong{font-size:22px}a{font-size:19px;padding:14px 24px;min-height:50px}footer{font-size:14px;padding:22px}#status{font-size:19px}@media(max-width:600px){body{padding:8px}main{max-width:none;border-radius:18px}header{padding:24px 15px}header img{max-width:210px;max-height:135px}h1{font-size:25px}#content{padding:24px 15px}#portrait{width:180px;height:216px}h2{font-size:30px}p{font-size:19px}h3{font-size:22px}section{padding:20px 14px}strong{font-size:21px}a{width:100%;font-size:18px}}

/* Larger, responsive reading sizes for the public participant card. */
body{font-size:24px}h1{font-size:clamp(29px,4vw,38px);line-height:1.7}h2{font-size:clamp(34px,5vw,44px);line-height:1.6}p{font-size:clamp(23px,3vw,28px);line-height:1.9;margin:16px 0}h3{font-size:clamp(26px,3.5vw,32px);line-height:1.6}strong{font-size:clamp(25px,3.2vw,30px);line-height:1.8}a{font-size:clamp(22px,3vw,26px);line-height:1.6;padding:15px 22px}#contacts{font-size:clamp(25px,3.3vw,31px);line-height:2;unicode-bidi:plaintext}footer{font-size:17px;line-height:1.9}#status{font-size:23px;line-height:1.8}@media(max-width:600px){#content{padding:24px 14px}section{padding:22px 14px}h1{font-size:29px}h2{font-size:35px}p{font-size:24px}h3{font-size:27px}strong{font-size:26px}a{font-size:23px}#contacts{font-size:26px}footer{font-size:16px}}
</style></head><body><main><p id="status" role="status">جارٍ تحميل بيانات المشارك…</p><div id="profile" hidden><header><img id="logo" hidden alt="شعار المسابقة"><h1 id="competition"></h1></header><div id="content"><img id="portrait" hidden alt="صورة المشارك"><h2 id="name"></h2><p id="country"></p><p id="role"></p><section id="hotel-section"><h3>الإقامة والفندق</h3><strong id="hotel"></strong><p id="address"></p><p id="city"></p><a id="maps" hidden target="_blank" rel="noopener noreferrer">فتح موقع الفندق</a></section><section id="contact-section"><h3>التواصل مع المسابقة</h3><p id="contacts"></p></section></div><footer>وزارة الشؤون الإسلامية والدعوة والإرشاد</footer></div></main><script>
(()=>{const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),mode=params.get('competition'),id=params.get('id');const image=value=>typeof value==='string'&&/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(value)?value:'';function text(id,value){$(id).textContent=typeof value==='string'?value:'';}async function load(){if(!['international','local'].includes(mode)||! /^[a-f0-9]{32}$/.test(id||''))throw Error('رابط البطاقة غير صحيح.');const url='https://firestore.googleapis.com/v1/projects/quran-mus/databases/(default)/documents/competitions/'+mode+'/publicCards/'+id;const response=await fetch(url,{credentials:'omit'});if(response.status===404)throw Error('لم تُنشر بيانات هذه البطاقة بعد، أو تم إلغاء نشرها.');if(!response.ok)throw Error('تعذر تحميل البيانات. حاول لاحقًا أو تواصل مع إدارة المسابقة.');const doc=await response.json(),data=JSON.parse(doc.fields.payload.stringValue),c=data.competition||{};text('competition',c.name);text('name',data.name);text('country',data.country);text('role',data.role);text('hotel',c.hotelName);text('address',c.hotelAddress);text('city',c.country);text('contacts',c.contacts);for(const [id,value]of [['logo',c.logo],['portrait',data.photo]]){const source=image(value);if(source){$(id).src=source;$(id).hidden=false;}}if(/^#[0-9a-f]{6}$/i.test(c.pageBackground||''))document.body.style.backgroundColor=c.pageBackground;const background=image(c.pageImage);if(background){document.body.style.backgroundImage='url("'+background+'")';document.body.style.backgroundSize='cover';document.body.style.backgroundAttachment='fixed';}try{const link=new URL(c.hotelURL);if(['https:','http:'].includes(link.protocol)){$('maps').href=link.href;$('maps').hidden=false;}}catch(e){}$('hotel-section').hidden=![c.hotelName,c.hotelAddress,c.country,c.hotelURL].some(Boolean);$('contact-section').hidden=!c.contacts;$('status').hidden=true;$('profile').hidden=false;document.title=String(data.name||'بيانات المشارك');}load().catch(e=>{$('status').textContent=e.message;});})();
</script></body></html>
